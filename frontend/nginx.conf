server {
    listen 80;
    server_name _;
    client_max_body_size 300m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-Origin Isolation — required for SharedArrayBuffer (WASM multithreading).
    # Must appear on every response because nginx add_header doesn't inherit across
    # location blocks that define their own add_header directives.
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Vite build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # PWA entrypoints
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    location ~ ^/(apple-touch-icon\.png|icon-192\.png|icon-512\.png|icon-maskable-192\.png|icon-maskable-512\.png)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # Runtime API proxy (frontend -> app service in docker network).
    location /api/ {
        set $api_upstream "app:8000";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large file uploads and long-running processing jobs need generous timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        # API responses are consumed by JS fetch, not embedded — no isolation needed.
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # ONNX Runtime WASM files — served with explicit MIME types so .mjs files
    # are treated as JavaScript modules (nginx has no built-in .mjs type).
    location /onnx/ {
        types {
            application/wasm    wasm;
            text/javascript     mjs js;
        }
        add_header Cache-Control "public, max-age=86400";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA history fallback — always revalidate HTML so browsers pick up new deploys
    location / {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ /index.html;
    }
}
