<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELA Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #182132 0%, #0d1017 55%, #090b10 100%);
        color: #f4f6fa;
        font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
      }
      main {
        width: min(92vw, 560px);
        border: 1px solid #3a4250;
        border-radius: 16px;
        background: #1a1c22;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        color: #f3d13b;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #d7dce5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>The application shell is available, but this screen was opened without network access and before the requested route was cached.</p>
    </main>
  </body>
  </html>
